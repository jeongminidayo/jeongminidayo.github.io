<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
/* 링크 미리보기 이미지(1200x630). 카톡·인스타는 가운데를 잘라 쓰므로 내용은 가운데 정사각형 안에만 둔다. */
html,body{margin:0;width:1200px;height:630px}
body{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo',sans-serif;color:#1d1d1f;display:flex;align-items:center;justify-content:center;overflow:hidden;
 background:radial-gradient(60% 55% at 18% 22%,#f6e6dc 0,transparent 70%),radial-gradient(55% 60% at 85% 18%,#dfe3e6 0,transparent 70%),radial-gradient(70% 60% at 70% 95%,#e9dccd 0,transparent 70%),#f3ebe2}
.win{width:520px;border-radius:28px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.12),0 40px 90px rgba(50,35,20,.22)}
.t{height:64px;background:#f4f4f5;border-bottom:1px solid rgba(0,0,0,.07);display:flex;align-items:center;padding:0 26px;gap:14px}
.t i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.16)}
.in{padding:58px 0 66px;text-align:center}
h1{margin:0;font-size:112px;font-weight:700;line-height:1;letter-spacing:-.03em}
p{margin:26px 0 0;font-size:38px;font-weight:500;color:#86868b}
</style></head><body>
<div class="win"><div class="t"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><div class="in"><h1>이정민</h1><p>AI 강의 튜터</p></div></div>
</body></html>
