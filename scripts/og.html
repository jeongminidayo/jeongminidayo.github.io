<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@500;600&display=swap');
html,body{margin:0;width:1200px;height:630px}
body{background:#fff radial-gradient(#e6e3de 2px,transparent 2px) 0 0/34px 34px;font-family:'IBM Plex Sans KR',sans-serif;color:#151515;position:relative}
.bar{position:absolute;inset:0 0 auto 0;height:56px;border-bottom:2px solid #151515;background:#fff;display:flex;align-items:center;gap:36px;padding:0 36px;font-size:24px}
.bar b{font-weight:600}
.win{position:absolute;left:150px;top:150px;width:900px;border:2px solid #151515;background:#fff;box-shadow:0 18px 50px rgba(21,21,21,.1)}
.t{height:58px;border-bottom:2px solid #151515;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:500;position:relative}
.t i{position:absolute;left:20px;width:20px;height:20px;border:2px solid #151515;border-radius:50%}
.in{padding:44px 56px 56px}
h1{margin:0;font-size:92px;font-weight:600;line-height:1.1}
p{margin:18px 0 0;font-size:34px;color:#77736c}
</style></head><body>
<div class="bar"><b>이정민</b><span>글</span><span>강의</span><span>자료실</span><span>소개</span></div>
<div class="win"><div class="t"><i></i>소개</div><div class="in"><h1>이정민</h1><p>minglemin01.com</p></div></div>
</body></html>
